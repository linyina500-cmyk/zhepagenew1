name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit, builds, lint, and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck

  cloud-runtime:
    name: Cloud container and temporary browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build the pinned cloud runtime
        run: docker build -f cloud/Dockerfile -t zhepage-sync:ci .
      - name: Verify the browser under deployment restrictions
        run: >-
          docker run --rm --init --read-only --network=none
          --tmpfs /tmp:rw,nosuid,nodev,size=1073741824,mode=1777
          --tmpfs /home/pwuser:rw,nosuid,nodev,size=16777216,mode=1777
          --shm-size=1g --memory=3g --cpus=2 --pids-limit=512 --ulimit core=0
          --security-opt no-new-privileges:true
          --security-opt seccomp=cloud/seccomp_profile.json
          zhepage-sync:ci node cloud/check-runtime.mjs

  browser:
    name: Browser (${{ matrix.browser }})
    # Run Safari's engine on macOS. Linux WebKit uses a different font backend.
    runs-on: ${{ matrix.browser == 'webkit' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the selected browser in the isolated runner
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build Pages and test the local production artifact
        run: npm run test:browser -- --project=${{ matrix.browser }}
      - name: Retain browser diagnostics and exported image
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

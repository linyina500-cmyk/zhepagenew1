name: Browser extension

on:
  pull_request:
    paths:
      - 'browser-extension/**'
      - 'lib/wechat/api.mjs'
      - 'lib/localSync/**'
      - 'build/*extension*.mjs'
      - '.github/workflows/browser-extension.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unpacked:
    name: Unpacked Chrome (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run pack:extension
      - run: npm run test:extension
      - uses: actions/upload-artifact@v4
        with:
          name: browser-extension-${{ matrix.os }}
          path: dist-extension/zhepage-draft-extension.zip
          retention-days: 14

services:
  sync:
    image: zhepage-sync:development
    build:
      context: ..
      dockerfile: cloud/Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    ports:
      - "127.0.0.1:47832:47832"
    environment:
      SYNC_ALLOWED_ORIGINS: ${SYNC_ALLOWED_ORIGINS:?Set the exact HTTPS preview origin}
      SYNC_OWNER_ID: ${SYNC_OWNER_ID:-owner}
      SYNC_KEYS_FILE: /run/sync-secrets/keys.json
      SYNC_ACCESS_PASSWORD_FILE: /run/sync-secrets/access-password
      SYNC_GATEWAY_SECRET_FILE: /run/sync-secrets/gateway-secret
    volumes:
      - ${SYNC_SECRETS_DIR:?Set an absolute private directory}:/run/sync-secrets:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1073741824,mode=1777
      - /home/pwuser:rw,nosuid,nodev,size=16777216,mode=1777
    shm_size: 1gb
    mem_limit: 3g
    cpus: 2
    pids_limit: 512
    ulimits:
      core: 0
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp_profile.json
